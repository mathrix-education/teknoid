apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: services
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - args: ["--appendonly", "yes"]
          image: redis:5.0-alpine
          imagePullPolicy: IfNotPresent
          name: redis
          ports:
          - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: "/data"
              name: redis-volume
      volumes:
        - name: redis-volume
          persistentVolumeClaim:
            claimName: redis-pvc
