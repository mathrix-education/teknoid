apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-server
  namespace: stable
  labels:
    app: railgun
    type: server
spec:
  selector:
    matchLabels:
      app: railgun
      type: server
  template:
    metadata:
      labels:
        app: railgun
        type: server
    spec:
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-api:7.0.0-dev-196.379f806
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: env-configmap
          volumeMounts:
            - name: keychain-volume
              mountPath: /var/www/storage/keychain
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:1.1.0
          imagePullPolicy: IfNotPresent
          args: [server]
          env:
            - name: PHP_FPM_SCRAPE_URI
              value: tcp://127.0.0.1:9000/status
      volumes:
        - name: keychain-volume
          configMap:
            name: keychain
          
              
