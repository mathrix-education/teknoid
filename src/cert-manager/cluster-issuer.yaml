apiVersion: cert-manager.io/v1alpha2
kind: ClusterIssuer
metadata:
  name: teknoid
  namespace: edge
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: valentin.pollart@mathrix.fr
    privateKeySecretRef:
      name: certmanager-account-key
    solvers:
      - dns01:
          clouddns:
            serviceAccountSecretRef:
              name: clouddns
              key: clouddns.key.json
            project: mathrix-education
