apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
commonLabels:
  app.kubernetes.io/part-of: institut
  app.kubernetes.io/managed-by: kustomize
secretGenerator:
  - name: institut-env
    envs: [secrets/.env]
resources:
  - stateful-set.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: wordpress
    newTag: 5.5.1-php7.3-apache