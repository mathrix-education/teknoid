apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: discovery
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: htpasswd
spec:
  rules:
    - host: edge.mathrix.tech
      http:
        paths:
          - path: /
            backend:
              serviceName: discovery
              servicePort: 4000
  tls:
    - hosts:
        - edge.mathrix.tech
      secretName: edge.mathrix.tech-secret
