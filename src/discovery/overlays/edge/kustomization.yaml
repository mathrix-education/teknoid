apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge
commonLabels:
  app.kubernetes.io/part-of: discovery
  app.kubernetes.io/managed-by: kustomize
secretGenerator:
  - name: htpasswd
    files: [secrets/auth]
  - name: discovery-env
    behavior: merge
    envs: [secrets/.env]
resources:
  - ../../base
patchesStrategicMerge:
  - ingress.yaml
  - deployment.yaml
images:
  - name: eu.gcr.io/mathrix-education/discovery
    newTag: latest-edge
