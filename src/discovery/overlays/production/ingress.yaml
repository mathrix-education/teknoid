apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: discovery
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  rules:
    - host: mathrix.fr
      http:
        paths:
          - path: /
            backend:
              serviceName: discovery
              servicePort: 4000
  tls:
    - hosts:
        - mathrix.fr
        - www.mathrix.fr
      secretName: mathrix.fr-secret
