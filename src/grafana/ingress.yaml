apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana-ingress
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: teknoid
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
spec:
  rules:
    - host: monitoring.mathrix.tech
      http:
        paths:
          - backend:
              serviceName: grafana
              servicePort: 3000
  tls:
    - hosts:
        - monitoring.mathrix.tech
      secretName: monitoring.mathrix.tech-secret
