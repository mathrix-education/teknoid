apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
commonLabels:
  app.kubernetes.io/name: grafana
  app.kubernetes.io/part-of: grafana
secretGenerator:
  - name: grafana-config
    files: [config/grafana.ini]
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: grafana/grafana
    newTag: 6.7.3
