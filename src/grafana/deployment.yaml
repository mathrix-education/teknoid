apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana-server
    app.kubernetes.io/component: deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-server
        app.kubernetes.io/component: server
    spec:
      volumes:
        - name: config
          secret:
            secretName: grafana-config
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
      containers:
        - image: grafana/grafana
          name: grafana
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 2500Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /etc/grafana/grafana.ini
              name: config
              subPath: grafana.ini
            - mountPath: /var/lib/grafana
              name: data
      restartPolicy: Always
