apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  labels:
    app.kubernetes.io/name: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toolbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toolbox
    spec:
      containers:
        - name: alpine
          image: alpine:3
          lifecycle:
            postStart:
              exec:
                command: [/usr/local/bin/init.sh]
          command: [tail, -f, /dev/null]
          volumeMounts:
            - mountPath: /usr/local/bin/init.sh
              subPath: init.sh
              name: init-sh
      volumes:
        - name: init-sh
          configMap:
            name: init-sh
            defaultMode: 0777
