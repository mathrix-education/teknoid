apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: services
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: 'redis:5.0-alpine'
          args: ['--appendonly', 'yes']
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: "/data"
              name: redis-volume
        - name: redis-exporter
          image: 'oliver006/redis_exporter:alpine'
          ports:
            - containerPort: 9121
      volumes:
        - name: redis-volume
          persistentVolumeClaim:
            claimName: redis-pvc
