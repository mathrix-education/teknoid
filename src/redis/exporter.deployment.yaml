apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/component: exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/component: exporter
      annotations:
        prometheus.io/port: '9121'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:alpine
          env:
            - name: REDIS_ADDR
              value: redis.services.svc.cluster.local
