apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
commonLabels:
  app.kubernetes.io/part-of: redis
  app.kubernetes.io/managed-by: kustomize
configMapGenerator:
  - name: redis-conf
    files:
      - config/redis.conf
      - config/sentinel.conf
resources:
  - service.yaml
  - statefulset.yaml
images:
  - name: redis
    newTag: 6.0-alpine
  - name: oliver006/redis_exporter
    newTag: alpine
