apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
commonLabels:
  app.kubernetes.io/part-of: redis
configMapGenerator:
  - name: redis-conf
    files:
      - config/redis.conf
resources:
  - service.yaml
  - deployment.yaml
images:
  - name: redis
    newTag: 6.0-alpine
