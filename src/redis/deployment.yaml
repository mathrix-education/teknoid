apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/port: '9121'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: redis-server
          image: redis
          args: [/etc/redis/redis.conf]
          volumeMounts:
            - mountPath: /etc/redis/redis.conf
              name: redis-conf
              subPath: redis.conf
          resources:
            requests:
              cpu: 10m
              memory: 2Gi
            limits:
              cpu: 10m
              memory: 2Gi
        - name: redis-exporter
          image: oliver006/redis_exporter:alpine
      volumes:
        - name: redis-conf
          configMap:
            name: redis-conf
