apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: angular
  annotations:
    nginx.ingress.kubernetes.io/auth-secret: htaccess
spec:
  rules:
    - host: edge.mathrix.tech
      http:
        paths:
          - path: /
            backend:
              serviceName: angular
              servicePort: 4000
  tls:
    - hosts:
        - edge.mathrix.tech
      secretName: edge.mathrix.tech-secret
