apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-angular-v7
  labels:
    app.kubernetes.io/name: education-angular-v7
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: education-angular-v7
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-angular-v7
        app.kubernetes.io/component: server
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [education-angular-v7]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-angular-v7
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
#            limits:
#              cpu: 100m
#              memory: 128Mi
          envFrom:
            - configMapRef:
                name: education-angular-v7-env
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /
              port: 4000
              httpHeaders:
                - name: User-Agent
                  value: Kubernetes Liveness Probe
