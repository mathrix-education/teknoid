apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-angular-v7
  labels:
    app.kubernetes.io/name: education-angular-v7
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: education-angular-v7
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-angular-v7
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-angular-v7
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 30m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: education-angular-v7-env
          ports:
            - containerPort: 4000
