apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: education-angular-v7-renderer
spec:
  schedule: '0 * * * *'
  concurrencyPolicy: Forbid
  suspend: true
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800 # 30 minutes maximum
      template:
        spec:
          containers:
            - name: renderer
              image: eu.gcr.io/mathrix-education/education-angular-v7
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: 1000m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
              command:
                - node
                - /var/www/dist/server/main
                - render
              envFrom:
                - configMapRef:
                    name: education-angular-v7-env
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                      - key: cloud.google.com/gke-preemptible
                        operator: In
                        values:
                          - 'true'
