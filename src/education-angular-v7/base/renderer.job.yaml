apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: education-angular-v7-renderer
spec:
  schedule: '0 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800 # 30 minutes maximum
      template:
        spec:
          containers:
            - name: renderer
              image: eu.gcr.io/mathrix-education/education-angular-v7
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: '1'
                  memory: 768Mi
                limits:
                  cpu: '1'
                  memory: 768Mi
              args: [render]
              envFrom:
                - secretRef:
                    name: education-angular-v7-env
          restartPolicy: OnFailure
