apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
secretGenerator:
  - name: education-angular-v7-env
    behavior: merge
    envs: [secrets/.env]
resources:
  - ../../base
patchesStrategicMerge:
  - ingress.yaml
  - deployment.yaml
images:
  - name: eu.gcr.io/mathrix-education/education-angular-v7
    newTag: latest-production
