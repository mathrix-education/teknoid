apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: grimoire
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: teknoid
spec:
  rules:
    - host: grimoire.mathrix.fr
      http:
        paths:
          - path: /
            backend:
              serviceName: grimoire
              servicePort: 8080
  tls:
    - hosts:
        - grimoire.mathrix.fr
      secretName: grimoire.mathrix.fr-secret
