apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack-server
  labels:
    app.kubernetes.io/name: bookstack-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstack-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstack-server
    spec:
      containers:
        - name: server
          image: solidnerd/bookstack:0.29.1
#          resources:
#            requests:
#              cpu: 100m
#              memory: 128Mi
#            limits:
#              cpu: 100m
#              memory: 128Mi
          envFrom:
            - configMapRef:
                name: grimoire-env
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: public-uploads
              mountPath: /var/www/bookstack/public/uploads
            - name: storage-uploads
              mountPath: /var/www/bookstack/storage/uploads
      volumes:
        - name: public-uploads
          persistentVolumeClaim:
            claimName: public-uploads
        - name: storage-uploads
          persistentVolumeClaim:
            claimName: storage-uploads
