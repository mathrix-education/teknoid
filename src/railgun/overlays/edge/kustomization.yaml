apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge
secretGenerator:
  - name: railgun-env
    behavior: merge
    envs: [secrets/.env]
  - name: keychain
    files:
      - secrets/login.json
      - secrets/reset.json
resources:
  - ../../base
  - service-account.yaml
patchesStrategicMerge:
  - ingress.yaml
  - server.replicas.yaml
images:
  - name: eu.gcr.io/mathrix-education/education-api
    newTag: latest-production
