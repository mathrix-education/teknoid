apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-server
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: fault-tolerant
                    operator: In
                    values:
                      - 'true'
