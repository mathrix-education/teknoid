apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: railgun
spec:
  rules:
    - host: mathrix.fr
      http:
        paths:
          - path: /()(sitemap).xml
            backend:
              serviceName: railgun
              servicePort: 8080
          - path: /graphql(/|$)(.*)
            backend:
              serviceName: railgun
              servicePort: 8080
  tls:
    - hosts:
        - mathrix.fr
      secretName: mathrix.fr-secret
