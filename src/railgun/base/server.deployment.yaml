apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-server
  labels:
    app.kubernetes.io/name: railgun-server
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: railgun-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railgun-server
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/port: '9253'
        prometheus.io/scrape: 'true'
    spec:
      serviceAccountName: railgun
      tolerations:
        - key: fault-tolerant
          operator: Equal
          value: 'true'
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [railgun-server]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-api
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: railgun-env
          volumeMounts:
            - name: www-conf
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
            - name: keychain
              mountPath: /var/www/storage/keychain
            - name: shared
              mountPath: /var/shared
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp -r /var/www/* /var/shared"]
          readinessProbe:
            exec:
              command:
                - php-fpm-healthcheck
            initialDelaySeconds: 3
            periodSeconds: 1
        - name: nginx
          image: nginx
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: User-Agent
                  value: Kubernetes Liveness Probe
            initialDelaySeconds: 3
            periodSeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 30m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: shared
              mountPath: /var/www
      #        - name: php-fpm-exporter
      #          image: hipages/php-fpm_exporter
      #          imagePullPolicy: IfNotPresent
      #          resources:
      #            requests:
      #              cpu: 10m
      #              memory: 32Mi
      #            limits:
      #              cpu: 20m
      #              memory: 64Mi
      #          args: [server]
      #          env:
      #            - name: PHP_FPM_SCRAPE_URI
      #              value: tcp://127.0.0.1:9000/status
      volumes:
        - name: keychain
          secret:
            secretName: keychain
        - name: www-conf
          configMap:
            name: www-conf
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: shared
          emptyDir: {}
