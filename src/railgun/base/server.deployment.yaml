apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-server
  labels:
    app.kubernetes.io/name: railgun-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: railgun-server
  strategy:
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railgun-server
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/port: '9253'
        prometheus.io/scrape: 'true'
    spec:
      serviceAccountName: railgun
      volumes:
        - name: keychain
          secret:
            secretName: keychain
        - name: www-conf
          configMap:
            name: www-conf
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: shared
          emptyDir: {}
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-api
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 50m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: railgun-env
          volumeMounts:
            - name: www-conf
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
            - name: keychain
              mountPath: /var/www/storage/keychain
            - name: shared
              mountPath: /var/shared
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp -r /var/www/* /var/shared"]
        - name: nginx
          image: nginx
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 30m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: shared
              mountPath: /var/www
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 20m
              memory: 64Mi
          args: [server]
          env:
            - name: PHP_FPM_SCRAPE_URI
              value: tcp://127.0.0.1:9000/status
