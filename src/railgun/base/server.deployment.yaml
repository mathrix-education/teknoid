apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-server
  labels:
    app.kubernetes.io/name: railgun-server
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: railgun-server
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railgun-server
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: railgun
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [railgun-server]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-api
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: keychain
              mountPath: /var/www/storage/keychain
              readOnly: true
          envFrom:
            - secretRef:
                name: railgun-env
          args: [server, --workers=4]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
#          readinessProbe:
#            exec:
#              command: [railgun, ready]
#            initialDelaySeconds: 3
#            periodSeconds: 1
#          livenessProbe:
#            httpGet:
#              port: 8080
#              path: '/healthz?checks=database,redis'
#            initialDelaySeconds: 5
#            periodSeconds: 10
      volumes:
        - name: keychain
          secret:
            secretName: keychain
