apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-worker
  labels:
    app.kubernetes.io/name: railgun-worker
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: railgun-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railgun-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: railgun
      containers:
        - args: [worker]
          image: eu.gcr.io/mathrix-education/education-api:latest-v7
          imagePullPolicy: IfNotPresent
          name: worker
          envFrom:
            - secretRef:
                name: railgun-env
          volumeMounts:
            - name: keychain
              mountPath: /var/www/storage/keychain
      volumes:
        - name: keychain
          secret:
            secretName: keychain
          
              
