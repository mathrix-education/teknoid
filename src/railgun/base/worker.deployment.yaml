apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-worker
  labels:
    app.kubernetes.io/name: railgun-worker
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: railgun-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railgun-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: railgun
      tolerations:
        - key: fault-tolerant
          operator: Equal
          value: 'true'
          effect: NoSchedule
      nodeSelector:
        cloud.google.com/gke-preemptible: 'true' # Workers are only allowed to run on fault-tolerant nodes
      containers:
        - name: worker
          image: eu.gcr.io/mathrix-education/education-api
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 30m
              memory: 256Mi
          args: [worker]
          envFrom:
            - secretRef:
                name: railgun-env
          volumeMounts:
            - name: keychain
              mountPath: /var/www/storage/keychain
      volumes:
        - name: keychain
          secret:
            secretName: keychain
          
              
