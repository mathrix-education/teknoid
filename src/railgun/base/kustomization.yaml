apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app.kubernetes.io/part-of: railgun
  app.kubernetes.io/managed-by: kustomize
secretGenerator:
  - name: railgun-env
    envs: [secrets/.env]
resources:
  - ingress.yaml
  - server.deployment.yaml
  - server.service.yaml
  - worker.deployment.yaml
