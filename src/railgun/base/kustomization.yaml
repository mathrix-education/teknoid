apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app.kubernetes.io/part-of: railgun
  app.kubernetes.io/managed-by: kustomize
configMapGenerator:
  - name: nginx-conf
    files:
      - nginx.conf
secretGenerator:
  - name: railgun-env
    envs: [.env]
resources:
  - ingress.yaml
  - server.deployment.yaml
  - server.service.yaml
  - worker.deployment.yaml
images:
  - name: nginx
    newTag: 1.17-alpine
  - name: hipages/php-fpm_exporter
    newTag: 1.1.0
