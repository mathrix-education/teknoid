apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  namespace: edge
  name: railgun
  annotations:
    kubernetes.io/ingress.class: nginx
    # CORS support
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Correlation-ID"
    # client_body_size for uploads
    nginx.ingress.kubernetes.io/client-body-buffer-size: 100m
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    cert-manager.io/cluster-issuer: teknoid
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: edge.mathrix.tech
      http:
        paths:
          - path: /graphql(/|$)(.*)
            backend:
              serviceName: railgun
              servicePort: 8080
  tls:
    - hosts:
        - edge.mathrix.tech
      secretName: edge.mathrix.tech-secret
