apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: api-ingress
  namespace: edge
  annotations:
    kubernetes.io/ingress.class: nginx
    # CORS support
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Correlation-ID"
    # client_body_size for uploads
    nginx.ingress.kubernetes.io/client-body-buffer-size: 100m
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.ingress.kubernetes.io/backend-protocol: "FCGI"
    nginx.ingress.kubernetes.io/fastcgi-index: "index.php"
    nginx.ingress.kubernetes.io/fastcgi-params-configmap: "fastcgi-configmap"
    cert-manager.io/cluster-issuer: teknoid
spec:
  rules:
    - host: graphql.mathrix.tech
      http:
        paths:
          - backend:
              serviceName: railgun
              servicePort: 9000
  tls:
    - hosts:
        - graphql.mathrix.tech
      secretName: graphql.mathrix.tech-secret
