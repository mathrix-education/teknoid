apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-worker
  namespace: edge
  labels:
    app: railgun
    type: worker
spec:
  selector:
    matchLabels:
      app: railgun
      type: worker
  template:
    metadata:
      labels:
        app: railgun
        type: worker
    spec:
      containers:
        - args: [worker]
          image: eu.gcr.io/mathrix-education/education-api:latest-v7
          imagePullPolicy: IfNotPresent
          name: worker
          envFrom:
            - configMapRef:
                name: env-configmap
          volumeMounts:
            - name: keychain-volume
              mountPath: /var/www/storage/keychain
      volumes:
        - name: keychain-volume
          configMap:
            name: keychain
          
              
