apiVersion: apps/v1
kind: Deployment
metadata:
  name: railgun-server
  namespace: edge
  labels:
    app: railgun
    type: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: railgun
      type: server
  template:
    metadata:
      labels:
        app: railgun
        type: server
    spec:
      containers:
        - image: eu.gcr.io/mathrix-education/education-api:latest-v7
          imagePullPolicy: IfNotPresent
          name: server
          envFrom:
          - configMapRef:
              name: env-configmap
          volumeMounts:
          - name: keychain-volume
            mountPath: /var/www/storage/keychain
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:1.1.0
          imagePullPolicy: IfNotPresent
          args: [server]
          env:
            - name: PHP_FPM_SCRAPE_URI
              value: tcp://127.0.0.1:9000/status
      volumes:
        - name: keychain-volume
          configMap:
            name: keychain
          
              
