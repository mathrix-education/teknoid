apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: edge
  name: railgun-server
  labels:
    app.kubernetes.io/name: railgun-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: railgun
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: railgun-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railgun-server
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: railgun
    spec:
      containers:
        - name: server
          image: eu.gcr.io/mathrix-education/education-api:7.0.0-dev-457.v7.e198865
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: env-configmap
          volumeMounts:
            - name: keychain-volume
              mountPath: /var/www/storage/keychain
            - name: public-volume
              mountPath: /var/shared
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp -r /var/www/* /var/shared"]
        - name: nginx
          image: nginx:mainline-alpine
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-conf-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: public-volume
              mountPath: /var/www
#        - name: php-fpm-exporter
#          image: hipages/php-fpm_exporter:1.1.0
#          imagePullPolicy: IfNotPresent
#          args: [server]
#          env:
#            - name: PHP_FPM_SCRAPE_URI
#              value: tcp://127.0.0.1:9000/status
      volumes:
        - name: keychain-volume
          configMap:
            name: keychain
        - name: nginx-conf-volume
          configMap:
            name: nginx-conf
        - name: public-volume
          emptyDir: {}

