apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: edge
  labels:
    app: railgun
    type: server
spec:
  selector:
    matchLabels:
      app: railgun
      type: server
  template:
    metadata:
      labels:
        app: railgun
        type: server
    spec:
      containers:
        - image: eu.gcr.io/mathrix-education/education-api:7.0.0-dev-393.v7-prometheus.1dc3ec0
          imagePullPolicy: IfNotPresent
          name: php-server
          envFrom:
          - configMapRef:
              name: env-configmap
          volumeMounts:
          - name: keychain-volume
            mountPath: /var/www/storage/keychain
      volumes:
        - name: keychain-volume
          configMap:
            name: keychain
          
              
