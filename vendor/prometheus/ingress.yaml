apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: services
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    cert-manager.io/cluster-issuer: teknoid
spec:
  rules:
    - host: prometheus.mathrix.tech
      http:
        paths:
          - backend:
              serviceName: prometheus-server
              servicePort: 9090
  tls:
    - hosts:
        - prometheus.mathrix.tech
      secretName: prometheus.mathrix.tech-secret
