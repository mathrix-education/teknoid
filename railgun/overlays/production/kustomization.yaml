apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - service-account.yaml
patchesStrategicMerge:
  - ingress.yaml
  - server.deployment.replicas.yaml
  - worker.deployment.replicas.yaml
configMapGenerator:
  - name: keychain
    files:
      - keychain/login.json
      - keychain/reset.json
  - name: railgun-env
    behavior: merge
    envs: [.env]
