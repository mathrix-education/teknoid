apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app.kubernetes.io/part-of: railgun
  app.kubernetes.io/managed-by: kustomize
resources:
  - ingress.yaml
  - server.deployment.yaml
  - server.service.yaml
  - worker.deployment.yaml
configMapGenerator:
  - name: nginx-conf
    files:
      - nginx.conf
  - name: railgun-env
    envs: [.env]
