apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: railgun
spec:
  rules:
    - host: edge.mathrix.tech
      http:
        paths:
          - path: /graphql(/|$)(.*)
            backend:
              serviceName: railgun
              servicePort: 8080
  tls:
    - hosts:
        - edge.mathrix.tech
      secretName: edge.mathrix.tech-secret
