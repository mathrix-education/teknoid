apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge
resources:
  - ../base
  - ingress.yaml
  - env.configmap.yaml
  - namespace.yaml
configMapGenerator:
  - name: keychain
    files:
      - ./keychain/google_cloud_auth.json
      - ./keychain/login.json
      - ./keychain/reset.json

